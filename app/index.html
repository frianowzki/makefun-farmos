<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="farmOS — a quiet way to read make.fun's open bounties: rewards, live pots, deadlines, leaderboards and the people who enter them.">
<title>Bounties · farmOS</title>
<link rel="stylesheet" href="style.css">
<script>
  // The theme before the first paint: the reader's stored choice, else the system's, exactly as
  // main.js resolves it. Kept tiny and inline so no page ever flashes the wrong one.
  try {
    var t = localStorage.getItem('farmOS.theme');
    if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>
<script type="module" src="main.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <nav class="rail" aria-label="Primary">
    <a class="mark" href="#/" aria-label="farmOS, the bounty board"><span>farmOS</span><span>Bounties</span></a>
    <div class="nav">
      <a href="#/" data-nav="board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="roof" x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
        <span>Board</span>
      </a>
      <a href="#/u/frianowzki" data-nav="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
        <span>Profile</span>
      </a>
      <a href="https://make.fun/bounties" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5"/><path d="M19 5l-7 7"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg>
        <span>make.fun</span>

    </div>
    <div class="rail-foot">
      <button class="theme" type="button" id="theme-toggle" aria-pressed="false">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <span id="theme-label">Dark</span>
      </button>
      <p class="foot-note">Live from make.fun's public API.</p>
    </div>
  </nav>
  <main id="main" tabindex="-1">
    <div class="wrap" id="view"></div>
  </main>
</div>
</body>
</html>
